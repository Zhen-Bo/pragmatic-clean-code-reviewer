name: Release Skill Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill
        run: python scripts/validate_skill.py .

  release:
    name: Package and Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes diff against the previous
          # tag, which a shallow clone cannot resolve (no HEAD^, no tags).
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Verify tag matches SKILL.md metadata.version
        run: |
          set -euo pipefail
          # Full validation, plus the tag/metadata.version binding. Any failure
          # (including a missing or unreadable version) exits non-zero.
          python3 scripts/validate_skill.py . --expected-version "${GITHUB_REF_NAME#v}"

      - name: Create skill package
        run: |
          set -euo pipefail
          SKILL_NAME="smell-check"
          VERSION="${GITHUB_REF_NAME}"

          # Create package directory
          mkdir -p dist

          # Skill payload: contract, license, all reference registries, and
          # bundled measure scripts. docs/ is repository-only and never ships.
          # validate_skill.py stays in the repo for CI; it is not a runtime
          # dependency of the skill and is omitted from the package.
          zip -r "dist/${SKILL_NAME}-${VERSION}.skill" \
            SKILL.md \
            README.md \
            LICENSE \
            references/clean-architecture.md \
            references/clean-code.md \
            references/configuration.md \
            references/language-adjustments.md \
            references/measurement.md \
            references/pragmatic-programmer.md \
            references/presets.md \
            references/principles-glossary.md \
            references/rules-code.md \
            references/rules-test.md \
            scripts/measure_python.py \
            scripts/measure_ts.mjs \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.DS_Store"

          # Same payload under .zip for clients that reject the .skill extension
          cp "dist/${SKILL_NAME}-${VERSION}.skill" "dist/${SKILL_NAME}-${VERSION}.zip"

          echo "📦 Created packages:"
          ls -la dist/

      - name: Verify package contents
        run: |
          set -euo pipefail
          PKG="dist/smell-check-${GITHUB_REF_NAME}.skill"
          MANIFEST=$(unzip -Z1 "$PKG")
          echo "$MANIFEST"

          required=(
            SKILL.md
            README.md
            LICENSE
            references/clean-architecture.md
            references/clean-code.md
            references/configuration.md
            references/language-adjustments.md
            references/measurement.md
            references/pragmatic-programmer.md
            references/presets.md
            references/principles-glossary.md
            references/rules-code.md
            references/rules-test.md
            scripts/measure_python.py
            scripts/measure_ts.mjs
          )
          for required in "${required[@]}"; do
            if ! printf '%s\n' "$MANIFEST" | grep -qxF "$required"; then
              echo "❌ Missing from package: $required"
              exit 1
            fi
          done

          if printf '%s\n' "$MANIFEST" | grep -q '^docs/'; then
            echo "❌ docs/ must not be packaged"
            exit 1
          fi

          # Deleted v2 packs must not reappear
          for banned in \
            references/design-and-maintainability.md \
            references/testing.md \
            references/security-and-privacy.md \
            references/contracts-and-compatibility.md \
            references/reliability-and-operations.md \
            references/dependencies-and-build.md \
            references/documentation.md \
            references/research-reproducibility.md
          do
            if printf '%s\n' "$MANIFEST" | grep -qxF "$banned"; then
              echo "❌ Banned v2 pack in package: $banned"
              exit 1
            fi
          done

          echo "✅ Package contents verified"

      - name: Generate release notes
        id: release_notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${GITHUB_REF_NAME}..."
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            echo "First release, generating full changelog..."
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          # Write to file for multi-line handling
          cat << EOF > release_notes.md
          ## What's Changed

          $CHANGELOG

          ## Installation

          Works with any harness that supports the Agent Skills format. Install
          into your harness skills directory:

          | Harness | Skills directory |
          |---------|------------------|
          | **Claude Code** | \`~/.claude/skills/\` |
          | **Codex** | \`~/.codex/skills/\` |
          | **OpenCode** | \`~/.config/opencode/skills/\` |
          | **Other Agent Skills runner** | your harness's skills directory |

          ### Option 1: Clone directly
          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git <skills-directory>/smell-check
          \`\`\`

          ### Option 2: Download and extract
          1. Download the \`.skill\` or \`.zip\` file from this release
          2. Extract to \`<skills-directory>/smell-check/\`

          ## Usage

          Invoke the skill with:
          \`\`\`
          /smell-check
          \`\`\`

          Or use natural language: "Run a smell audit on src/"
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.skill
            dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
